name: Protected release promotion

on:
  workflow_run:
    workflows: [CI and release, Linux development port, Beta release]
    types: [completed]

permissions:
  contents: read

# Serialize stable and beta publication, including interrupted-run reconciliation.
concurrency:
  group: protected-release-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Verify authority and promote
    if: >-
      vars.RELEASE_PROMOTION_ENABLED == 'true' &&
      github.repository == 'oangsa/RoLauncher' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.name == 'Beta release')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      # workflow_run's github.sha is the trusted default-branch revision, never head_sha.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source, intent, checks, rules and data-only artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PROMOTION_ENABLED: ${{ vars.RELEASE_PROMOTION_ENABLED }}
        run: python3 scripts/release_promotion.py
